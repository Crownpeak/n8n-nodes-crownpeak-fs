name: Bug report
description: Report a problem with the FirstSpirit REST API n8n node
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the workflow steps and node settings needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: n8n-version
    attributes:
      label: n8n version
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Node package version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste relevant n8n error output with secrets removed.
      render: shell
